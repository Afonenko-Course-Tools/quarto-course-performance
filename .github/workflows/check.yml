name: Проверка Performance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: 1.11.6
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Зависимости typed ESLint и module graph
        run: npm ci --ignore-scripts
      - name: Установка Hyperfine 2.0.0
        run: |
          curl -fL https://github.com/sharkdp/hyperfine/releases/download/v2.0.0/hyperfine_2.0.0_amd64.deb -o /tmp/hyperfine.deb
          echo "880ba127c51c7b9debde2d830fe27dedbfc92cf2885edd44f7dfbe2152f72afe  /tmp/hyperfine.deb" | sha256sum --check
          sudo dpkg -i /tmp/hyperfine.deb
      - name: Системный TypeScript и Compiler API
        run: |
          sudo apt-get update
          sudo apt-get install -y node-typescript
          tsc --version
          python3 - <<'PYTHON'
          import json
          import pathlib
          import shutil
          config = pathlib.Path("deno.json")
          settings = json.loads(config.read_text())
          compiler = pathlib.Path(shutil.which("tsc")).resolve().parent.parent / "lib" / "typescript.d.ts"
          if not compiler.is_file():
              raise SystemExit(f"Системный Compiler API не найден: {compiler}")
          settings["imports"]["typescript"] = compiler.as_uri()
          config.write_text(json.dumps(settings, ensure_ascii=False, indent=2) + "\n")
          PYTHON
      - name: Статическая проверка Python и shell
        run: |
          npm install --prefix "$RUNNER_TEMP/performance-python-types" --no-save --ignore-scripts pyright@1.1.414
          echo "$RUNNER_TEMP/performance-python-types/node_modules/.bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Единая подготовка LuaLS и отрицательный контроль
        run: |
          bash tools/setup-lua-ci.sh "$RUNNER_TEMP/performance-luals"
          echo "$RUNNER_TEMP/performance-luals/bin" >> "$GITHUB_PATH"
          deno run --no-config --no-lock -A tools/check-lua.ts --server "$RUNNER_TEMP/performance-luals/bin/lua-language-server" --probe
      - name: Проверить фактическую GNU mv no-replace capability
        run: bash tools/setup-mv-ci.sh "$RUNNER_TEMP/course-gnu-mv" >> "$GITHUB_PATH"
      - name: Фактические версии toolchain
        run: |
          quarto --version
          deno --version
          quarto pandoc --version
          lua-language-server --version
          pyright --version
          shellcheck --version
      - run: deno task check
      - name: Отрицательные контроли каждого quality rule
        run: npm run check-quality:controls
      - name: Native fixtures выбранных инструментов
        run: deno task test
      - name: Загрузка закреплённого Perfetto v58.2
        run: |
          curl -fL https://github.com/google/perfetto/releases/download/v58.2/linux-amd64.zip -o /tmp/perfetto-v58.2.zip
          echo "32c739f71b2d39721afd294c0b038f2499a44a71b5b6bcdd85b83faca0b240b9  /tmp/perfetto-v58.2.zip" | sha256sum --check
          mkdir /tmp/perfetto-v58.2
          unzip /tmp/perfetto-v58.2.zip -d /tmp/perfetto-v58.2
          chmod u+x /tmp/perfetto-v58.2/linux-amd64/trace_processor_shell
      - name: Фактический импорт Perfetto и отрицательные контроли
        run: deno task check:perfetto --trace-processor /tmp/perfetto-v58.2/linux-amd64/trace_processor_shell
